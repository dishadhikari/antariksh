events:

  - id: 0
    name: LEFT_HAND_UP
    description: Astronaut raises the left hand

  - id: 1
    name: RIGHT_HAND_UP
    description: Astronaut raises the right hand

  - id: 2
    name: PICK_BLUE_BOX
    description: Astronaut picks up the blue box

  - id: 3
    name: PUT_DOWN_BLUE_BOX
    description: Astronaut puts down the blue box

  - id: 4
    name: PICK_BLACK_BOX
    description: Astronaut picks up the black box

  - id: 5
    name: PUT_DOWN_BLACK_BOX
    description: Astronaut puts down the black box


experiment:
  id: "box_experiment"
  name: "Box Handling Experiment"
  version: "1.0"

sequence:
  - LEFT_HAND_UP
  - RIGHT_HAND_UP
  - PICK_BLUE_BOX
  - PUT_DOWN_BLUE_BOX
  - PICK_BLACK_BOX
  - PUT_DOWN_BLACK_BOX

objects:
  - blue_box
  - black_box